["拍下今天天空的颜色，回来给它取一个色号名","像油漆店那样",2,0],
["坐一趟没坐过的公交或地铁，只坐一站就下来","一站就好",2,0],
["数一路上遇到的红色东西，凑够七个就回","凑不够也算完成",2,0],
["去一个从没进过的小店，问一个不需要答案的问题","语气自然一点",2,1],
["找一个从没坐过的地方，坐五分钟，不看手机","第五分钟最难受",2,1],
["给街上一个看起来很认真的东西写一句颁奖词","招牌、长椅、井盖都行",2,1],
["带一张纸出门，只画你听到的声音","画得烂正好",2,2],
["走一条能到家但从没走过的路线，路上不查地图","迷路了算支线",2,2],
["出门拍 9 张照片，回来排成一条 30 秒的「城市今日」","不加音乐也行",2,3]
];

const KEY='boredom-gacha-v1';
const S=Object.assign({seen:[],done:[],today:0,day:'',pity:0,draws:0},load());
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const _d=new Date();
const today=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');
if(S.day!==today){S.day=today;S.today=0;save()}

const $=id=>document.getElementById(id);
const tiers=new Set([0,1,2]);
let current=-1, busy=false;

const CLERK={
 idle:'今天不安排正事。摇一下，随便领件小事。',
 cranking:'转起来了…别抱期待，反正也不重要。',
 N:'喏，一件很小的事。做不做都行。',
 R:'这个稍微有点意思，我多看了两眼。',
 SR:'哦？这张我收着了，你要是做了记得回来打卡。',
 SSR:'等等…机器卡了一下。这张不常见，随你。',
 done:'记下了。今天可以就这么结束了。',
 pity:'下一张会好一点，我盯着呢。'
};
function mood(m){$('clerkSvg').parentElement.className='clerk mood-'+m}
function say(k){$('bubble').textContent=CLERK[k]||k}
mood('idle');

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');
 clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1700)}

function sync(){
 $('cToday').textContent=S.today;
 $('cDone').textContent=S.done.length;
 $('cSeen').textContent=S.seen.length;
 $('cAll').textContent=POOL.length;
 $('pityHint').textContent=`再摇 ${10-S.pity} 次必出 SR 以上 · 所有数据只存在这台设备`;
 renderBook();
}
function renderBook(){
 const g=$('grid');g.innerHTML='';
 POOL.forEach((p,i)=>{
  const d=document.createElement('div');
  const seen=S.seen.includes(i), fin=S.done.includes(i);
  d.className='item'+(seen?'':' locked')+(fin?' finished':'');
  d.innerHTML=seen
    ? `<span class="k">${RAR[p[3]]} · NO.${String(i+1).padStart(3,'0')}${fin?' · 已完成':''}</span>${esc(p[0])}`
    : `NO.${String(i+1).padStart(3,'0')} · 还没抽到`;
  g.appendChild(d);
 });
 $('progressBar').style.width=(S.seen.length/POOL.length*100).toFixed(1)+'%';
 $('bookSub').textContent=`已收集 ${S.seen.length} / ${POOL.length} 件，打过卡的会有一圈绿边。`;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function pick(){
 let pool=POOL.map((p,i)=>({p,i})).filter(x=>tiers.has(x.p[2]));
 if(!pool.length){tiers.add(0);pool=POOL.map((p,i)=>({p,i})).filter(x=>x.p[2]===0)}
 const force=S.pity>=9;
 const w=force?[0,0,72,28]:[62,26,10,2];
 let r=Math.random()*100, rar=0;
 for(let k=0;k<4;k++){if(r<w[k]){rar=k;break}r-=w[k]}
 let bucket=pool.filter(x=>x.p[3]===rar);
 if(!bucket.length)bucket=pool.filter(x=>x.p[3]<=rar);
 if(!bucket.length)bucket=pool;
 return bucket[Math.floor(Math.random()*bucket.length)];
}

function confetti(){
 const cs=['#e8735b','#e0ad45','#63b79b','#8b7bd8','#5f8fc7'];
 for(let i=0;i<26;i++){
  const c=document.createElement('div');c.className='confetti';
  c.style.left=Math.random()*100+'vw';
  c.style.background=cs[i%cs.length];
  c.style.animationDelay=(Math.random()*.5)+'s';
  c.style.opacity=.9;
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),2600);
 }
}

function draw(){
 if(busy)return;
 busy=true;
 const btn=$('go');btn.disabled=true;btn.textContent='摇 啊 摇 …';
 $('machine').classList.add('cranking');say('cranking');mood('idle');
 const hit=pick();
 const isSSR=hit.p[3]===3;
 const caps=$('capsule');
 const colors=[['#ef9a85','#f7d9a0'],['#a99ae0','#eaf3f8'],['#8fc9b4','#f0cf82']][Math.floor(Math.random()*3)];
 caps.style.setProperty('--cap-a',colors[0]);caps.style.setProperty('--cap-b',colors[1]);
 caps.classList.remove('drop');void caps.offsetWidth;caps.classList.add('drop');

 setTimeout(()=>{
  $('machine').classList.remove('cranking');
  current=hit.i;
  S.draws++;S.today++;
  if(!S.seen.includes(hit.i))S.seen.push(hit.i);
  S.pity=(hit.p[3]>=2)?0:Math.min(10,S.pity+1);
  save();

  $('rarity').className='rarity '+RAR[hit.p[3]];
  $('rarity').textContent=RAR[hit.p[3]];
  $('no').textContent='NO.'+String(hit.i+1).padStart(3,'0');
  $('tag').textContent=TIERS[hit.p[2]];
  $('title').textContent=hit.p[0];
  $('note').textContent=hit.p[1];
  $('empty').style.display='none';
  const card=$('card');card.classList.remove('show');void card.offsetWidth;card.classList.add('show');
  $('finish').textContent=S.done.includes(hit.i)?'已经打过卡啦':'做完了';
  $('finish').classList.toggle('done',S.done.includes(hit.i));
  $('finish').classList.toggle('primary',!S.done.includes(hit.i));
  say(RAR[hit.p[3]]);mood(['n','r','sr','ssr'][hit.p[3]]);
  if(isSSR)confetti();
  btn.disabled=false;btn.textContent='再 摇 一 下';
  busy=false;sync();
 },isSSR?1150:760);
}

$('go').addEventListener('click',draw);
$('again').addEventListener('click',draw);
$('copy').addEventListener('click',()=>{
 if(current<0)return;
 const t=`【${TIERS[POOL[current][2]]}】${POOL[current][0]}（${POOL[current][1]}）`;
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(t).then(()=>toast('抄好了，贴哪儿都行')).catch(()=>fallbackCopy(t));
 }else fallbackCopy(t);
});
function fallbackCopy(t){
 const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);
 a.select();try{document.execCommand('copy');toast('抄好了，贴哪儿都行')}catch(e){toast('复制没成功，手动记一下吧')}
 a.remove();
}
$('finish').addEventListener('click',()=>{
 if(current<0)return;
 if(!S.done.includes(current)){S.done.push(current);save();toast('记下了 · 今天可以就这么结束')}
 else toast('这张已经打过卡啦');
 $('finish').textContent='已经打过卡啦';
 $('finish').classList.add('done');$('finish').classList.remove('primary');
 say('done');sync();
});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
 const t=+b.dataset.tier;
 if(tiers.has(t)){if(tiers.size===1){toast('至少留一档，不然机器没得吐');return}tiers.delete(t);b.classList.remove('on')}
 else{tiers.add(t);b.classList.add('on')}
}));
function openBook(){$('mask').classList.add('open');renderBook()}
$('openBook').addEventListener('click',openBook);
$('openBook2').addEventListener('click',openBook);
$('closeBook').addEventListener('click',()=>$('mask').classList.remove('open'));
$('mask').addEventListener('click',e=>{if(e.target===$('mask'))$('mask').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('mask').classList.remove('open')});
sync();
</script>
</body>
</html>
