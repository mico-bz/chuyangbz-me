<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 这页不见了</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%237c5cff'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08090c; --txt:#e9ecf1; --dim:#8b93a3; --dim-2:#5d6474;
  --acc:#7c5cff; --acc-2:#22d3ee;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:24px; overflow:hidden; position:relative;
  -webkit-font-smoothing:antialiased;
}
/* 背景光斑 */
body::before,body::after{
  content:""; position:fixed; border-radius:50%; filter:blur(110px); opacity:.22; pointer-events:none;
}
body::before{
  width:520px; height:520px; background:var(--acc);
  top:-180px; left:-140px;
}
body::after{
  width:460px; height:460px; background:var(--acc-2);
  bottom:-180px; right:-140px; opacity:.16;
}
.wrap{position:relative; text-align:center; max-width:520px; z-index:1}
.code{
  font-size:clamp(96px,22vw,152px); font-weight:800; line-height:.9;
  letter-spacing:-.05em;
  background:linear-gradient(135deg,var(--acc) 0%,var(--acc-2) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:8px;
}
h1{font-size:clamp(20px,4vw,26px); font-weight:600; margin-bottom:14px; letter-spacing:-.01em}
p{color:var(--dim); font-size:15px; line-height:1.65; margin-bottom:32px}
p code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92em;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
  padding:2px 7px; border-radius:6px; color:var(--txt);
}
a{
  display:inline-flex; align-items:center; gap:8px;
  padding:13px 26px; border-radius:999px; text-decoration:none;
  background:linear-gradient(135deg,var(--acc),#6d4bff); color:#fff;
  font-size:14.5px; font-weight:600;
  transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s;
  box-shadow:0 8px 26px rgba(124,92,255,.3);
}
a:hover{transform:translateY(-2px); box-shadow:0 12px 34px rgba(124,92,255,.42)}
a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>这页不存在</h1>
  <p>地址可能拼错了，或者我把它挪走了。<br>回首页看看？</p>
  <a href="/">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    回到首页
  </a>
</div>
</body>
</html>
